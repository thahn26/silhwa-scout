<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>실화탐사대</title>
<meta name="theme-color" content="#D7263D">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root {
  --bg: #F4F4F2; --surface: #FFFFFF; --surface-2: #F8F8F6; --surface-3: #EDEDEA;
  --ink: #16171A; --ink-2: #4A4D55; --ink-3: #80838B; --line: #E3E3DF; --line-2: #CFCFCA;
  --red: #D7263D; --red-soft: #FBE4E7; --amber: #C98100; --amber-soft: #FBF0D6;
  --blue: #2F63D8; --blue-soft: #E4ECFC; --green: #1E8A4C; --green-soft: #E1F3E8; --gray-soft: #EFEFEC;
  --g1: #B4362F; --g2: #2F5FB4; --g3: #9A6A00; --g4: #3F7D55; --g5: #7A4FB0;
  --font: "Pretendard Variable", Pretendard, system-ui, "Noto Sans KR", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1012; --surface: #17181B; --surface-2: #1C1D21; --surface-3: #25262B;
    --ink: #E9E9EA; --ink-2: #B3B4B9; --ink-3: #84868D; --line: #2A2B30; --line-2: #3A3B41;
    --red: #FF5A6B; --red-soft: #3A171C; --amber: #F2B13C; --amber-soft: #33270E;
    --blue: #7A9DFF; --blue-soft: #1A2440; --green: #4CC57F; --green-soft: #12291B; --gray-soft: #232428;
    --g1: #F07A70; --g2: #7FA4F2; --g3: #E0B550; --g4: #74C28E; --g5: #B894EE;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1012; --surface: #17181B; --surface-2: #1C1D21; --surface-3: #25262B;
  --ink: #E9E9EA; --ink-2: #B3B4B9; --ink-3: #84868D; --line: #2A2B30; --line-2: #3A3B41;
  --red: #FF5A6B; --red-soft: #3A171C; --amber: #F2B13C; --amber-soft: #33270E;
  --blue: #7A9DFF; --blue-soft: #1A2440; --green: #4CC57F; --green-soft: #12291B; --gray-soft: #232428;
  --g1: #F07A70; --g2: #7FA4F2; --g3: #E0B550; --g4: #74C28E; --g5: #B894EE;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
[hidden] { display: none !important; }

.top { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top) + 10px) 16px 0; }
.row1 { display: flex; align-items: center; gap: 10px; }
.dot { width: 11px; height: 11px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 4px var(--red-soft); flex: none; }
.brand { flex: 1; min-width: 0; }
.brand b { font-size: 17px; font-weight: 800; letter-spacing: -.02em; display: block; line-height: 1.2; }
.brand span { font-size: 12px; color: var(--ink-3); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon { width: 40px; height: 40px; border: 0; background: transparent; border-radius: 10px; display: grid; place-items: center; cursor: pointer; color: var(--ink-2); flex: none; }
.icon:active { background: var(--surface-3); }
.icon svg { width: 22px; height: 22px; }
.icon.busy svg { animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.syncdot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); display: inline-block; margin-right: 5px; vertical-align: 1px; }
.syncdot.ok { background: var(--green); } .syncdot.bad { background: var(--red); }

.tabs { display: flex; margin: 10px -16px 0; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 10px 0 11px; font-weight: 700; font-size: 14.5px; color: var(--ink-3);
  border-bottom: 2.5px solid transparent; cursor: pointer; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--red); }
.tabs .cnt { color: var(--red); margin-left: 3px; font-weight: 800; }

.tools { padding: 10px 16px 4px; display: flex; flex-direction: column; gap: 9px; }
.search { width: 100%; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); font-size: 15px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line-2); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.chip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip.first.on { background: var(--red); border-color: var(--red); color: #fff; }

.row2 { display: flex; gap: 8px; align-items: center; }
.seg { display: flex; background: var(--surface-3); border-radius: 9px; padding: 3px; flex: none; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; font-weight: 700; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.row2 .chip { margin-left: auto; }
.srcrow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }
.srcrow:first-of-type { border-top: 0; }
.srcrow input { width: 20px; height: 20px; accent-color: var(--red); flex: none; }
.srcrow span:first-of-type { flex: 1; }
.notice { margin: 8px 16px 0; padding: 10px 12px; border-radius: 10px; background: var(--amber-soft); font-size: 13px; color: var(--ink); }
.notice button { border: 0; background: transparent; color: var(--blue); font-weight: 700; padding: 0; cursor: pointer; }

.list { padding: 8px 12px calc(env(safe-area-inset-bottom) + 24px); display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 12px 10px; display: flex; gap: 10px; cursor: pointer; }
.card:active { background: var(--surface-2); }
.score { flex: none; width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; font-weight: 800; font-size: 17px; line-height: 1; position: relative; }
.score small { position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%); font-size: 9.5px; font-weight: 700; background: var(--surface); padding: 0 4px; border-radius: 4px; color: var(--ink-3); white-space: nowrap; }
.s-hot { background: var(--red); color: #fff; } .s-good { background: var(--red-soft); color: var(--red); }
.s-mid { background: var(--amber-soft); color: var(--amber); } .s-low { background: var(--gray-soft); color: var(--ink-3); }
.body { flex: 1; min-width: 0; }
.meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); flex-wrap: wrap; }
.src { font-weight: 700; }
.tag { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 5px; background: var(--gray-soft); color: var(--ink-2); }
.tag.w { background: var(--red-soft); color: var(--red); }
.tag.st { background: var(--blue-soft); color: var(--blue); }
.title { font-weight: 700; font-size: 15.5px; line-height: 1.4; margin: 3px 0 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: keep-all; overflow-wrap: anywhere; }
.reason { font-size: 13px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.memo-pre { font-size: 13px; color: var(--ink); background: var(--surface-2); border-left: 3px solid var(--blue); padding: 4px 8px; margin-top: 6px; border-radius: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.star { flex: none; width: 36px; height: 36px; margin: -6px -4px 0 0; border: 0; background: transparent; font-size: 22px; color: var(--line-2); cursor: pointer; }
.star.on { color: var(--amber); }
.more { margin: 6px auto 0; }
.empty { text-align: center; color: var(--ink-3); padding: 48px 20px; font-size: 14px; }
.btn { text-decoration: none; border: 1px solid var(--line-2); background: var(--surface); padding: 10px 14px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.red { background: var(--red); color: #fff; border-color: var(--red); }
.btn:disabled { opacity: .5; }

/* 상세·설정 시트 */
.sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; transform: translateY(100%); transition: transform .22s ease; }
.sheet.open { transform: none; }
.sheet .bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 6px; padding: calc(env(safe-area-inset-top) + 6px) 8px 6px; background: var(--surface); border-bottom: 1px solid var(--line); }
.sheet .bar b { flex: 1; font-size: 16px; }
.sheet .in { padding: 16px 16px calc(env(safe-area-inset-bottom) + 40px); }
.d-title { font-size: 19px; font-weight: 800; line-height: 1.4; margin: 6px 0 10px; word-break: keep-all; overflow-wrap: anywhere; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 10px; }
.box h5 { margin: 0 0 4px; font-size: 12px; color: var(--ink-3); font-weight: 700; }
.box p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.actions { display: flex; gap: 8px; margin-top: 14px; }
.actions .btn { flex: 1; }
.status { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
textarea { width: 100%; min-height: 120px; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); resize: vertical; font-size: 15px; }
.hint { font-size: 12.5px; color: var(--ink-3); }
.field { width: 100%; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); font-size: 15px; }
ol.steps { padding-left: 20px; margin: 6px 0 0; font-size: 14px; }
ol.steps li { margin: 4px 0; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 22px); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); text-align: center; }
</style>
</head>
<body>
<header class="top">
  <div class="row1">
    <span class="dot"></span>
    <div class="brand"><b>실화탐사대</b><span id="sub">불러오는 중…</span></div>
    <button class="icon" id="reload" aria-label="새로고침"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
    <button class="icon" id="openSet" aria-label="설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<div id="notice"></div>
<div class="tools" id="tools"></div>
<main class="list" id="list"></main>
<section class="sheet" id="sheet" aria-modal="true"></section>
<div class="toast" id="toast" hidden></div>
<script src="m.js"></script>
</body>
</html>
